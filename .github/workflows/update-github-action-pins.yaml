name: update-github-action-pins

# IMPORTANT!
# The following click-ops step must be taken to allow this workflow to update
# files under `.github/workflows/`.
# 1. Create a Personal Access Token (PAT) with the following permissions:
#    ```text
#    contents: read & write
#    metadata: read
#    pull-requests: read & write
#    workflows: read & write
#    ```
# 2. Use the PAT to populate a GitHub Actions secret called `PYCLICHE_GITHUB_ACTION_PINS_TOKEN`
#    (under `github.com/<user>/<repo>/settings/secrets/actions`).

on:
  workflow_dispatch:
  schedule:
    # Avoid minute 0 because GitHub Actions scheduled workflows can be delayed
    # or dropped during top-of-hour load spikes.
    - cron: "17 7 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-github-action-pins:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate GitHub Actions pins token
        env:
          GH_TOKEN: ${{ secrets.PYCLICHE_GITHUB_ACTION_PINS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::PYCLICHE_GITHUB_ACTION_PINS_TOKEN is not set."
            exit 1
          fi

          if ! gh api "repos/${GH_REPO}" --silent; then
            echo "::error::PYCLICHE_GITHUB_ACTION_PINS_TOKEN cannot read ${GH_REPO}. For a fine-grained PAT, grant it access to this repository with Contents: read/write, Pull requests: read/write, Workflows: read/write, and Metadata: read."
            exit 1
          fi
        shell: bash

      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.PYCLICHE_GITHUB_ACTION_PINS_TOKEN }}
          persist-credentials: false

      - name: Update GitHub Actions references
        run: python3 .github/scripts/update-github-action-pins.py

      - name: Refresh GitHub Actions lockfile
        env:
          GH_TOKEN: ${{ secrets.PYCLICHE_GITHUB_ACTION_PINS_TOKEN }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.PYCLICHE_GITHUB_ACTION_PINS_TOKEN }}
          BRANCH_NAME: automation/update-github-action-pins
          PR_BODY: Updates GitHub Actions references and their lockfile.
        run: |
          if git diff --quiet; then
            echo "GitHub Actions references and lockfile are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" || true
          git checkout -B "${BRANCH_NAME}"
          git add .github template
          git commit -m "ci: update GitHub Actions references"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "${BRANCH_NAME}"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH_NAME}" \
            --title "ci: update GitHub Actions references" \
            --body "${PR_BODY}" \
          || gh pr edit "${BRANCH_NAME}" \
            --title "ci: update GitHub Actions references" \
            --body "${PR_BODY}"
